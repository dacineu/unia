[package]
name = "askillify"
version = "0.1.0"
edition = "2021"

[dependencies]
uuid = { version = "1.7", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
aes-gcm = "0.10"
thiserror = "1.0"
tempfile = "3.10"
tokio = { version = "1.53.1", features = ["full"] }
serde_yaml = "0.9.34"
# Wasm support
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Console"] }
