[package]
name = "unia"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "An orchestration system that decouples agent intent from implementation using the .ure universal resource format and a Primitive Bridge."
license = "MIT"
license-file = "LICENSE"
readme = "README.md"
repository = "https://github.com/dacineu/unia"
homepage = "https://github.com/dacineu/unia"
documentation = "https://docs.rs/unia"
authors = ["unia contributors <dacineu@proton.me>"]
keywords = ["agent", "orchestration", "agents", "actuator", "wasm", "hardware-abstraction"]
categories = ["development-tools", "asynchronous", "wasm"]

[dependencies]
uuid = { version = "1.7", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9.34"
sha2 = "0.10"
aes-gcm = "0.10"
thiserror = "1.0"
tempfile = "3.10"
tokio = { version = "1.53.1", features = ["full"] }

# Signalling for peer-to-peer ca(R)maduci sessions. tokio-tungstenite with the
# rustls backend gives a WSS listener, which is what a browser peer requires; the
# same binary serves plaintext on loopback for local peers that do not.
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls-pemfile = "2"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console", "Window", "Response", "Request", "RequestInit", "RequestMode"] }

[dev-dependencies]
proptest = "1.11.0"

[features]
default = []
# Exposes the `.ure` corpus over MCP. Kept off by default so consumers of the
# library do not inherit the MCP SDK and its dependency tree; the store and its
# matcher are always available and have no such dependency.
mcp-server = ["dep:rmcp", "dep:schemars"]

[dependencies.rmcp]
version = "3.4.1"
optional = true
default-features = false
features = ["server", "macros", "transport-io"]

[dependencies.schemars]
version = "1"
optional = true

[lib]
name = "unia"
path = "src/lib.rs"

# Without this, a plain `cargo build` or `cargo test` tries to compile the binary
# in a configuration where the optional rmcp dependency is absent.
[[bin]]
name = "unia-mcp"
path = "src/bin/unia-mcp.rs"
required-features = ["mcp-server"]
